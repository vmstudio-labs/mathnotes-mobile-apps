name: Build Android Release APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-student-apk:
    name: Build Mathnotes Student APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Student Dependencies
        working-directory: apps/mathnotes-student
        run: npm install

      - name: Build Student Android Release APK
        working-directory: apps/mathnotes-student
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
          JAVA_OPTS: "-Dsun.net.client.defaultConnectTimeout=120000 -Dsun.net.client.defaultReadTimeout=120000"
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --version && break || sleep 5; done
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
          mkdir -p ../../../dist-apks
          cp app/build/outputs/apk/release/*.apk ../../../dist-apks/mathnotes-student.apk

      - name: Upload Student APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathnotes-student-apk
          path: dist-apks/mathnotes-student.apk

  build-teacher-apk:
    name: Build Mathnotes Teacher APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Teacher Dependencies
        working-directory: apps/mathnotes-teacher
        run: npm install

      - name: Build Teacher Android Release APK
        working-directory: apps/mathnotes-teacher
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
          JAVA_OPTS: "-Dsun.net.client.defaultConnectTimeout=120000 -Dsun.net.client.defaultReadTimeout=120000"
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --version && break || sleep 5; done
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
          mkdir -p ../../../dist-apks
          cp app/build/outputs/apk/release/*.apk ../../../dist-apks/mathnotes-teacher.apk

      - name: Upload Teacher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathnotes-teacher-apk
          path: dist-apks/mathnotes-teacher.apk

  build-agents-apk:
    name: Build Mathnotes Command OS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Agents Dependencies
        working-directory: apps/mathnotes-agents
        run: npm install

      - name: Build Agents Android Release APK
        working-directory: apps/mathnotes-agents
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
          JAVA_OPTS: "-Dsun.net.client.defaultConnectTimeout=120000 -Dsun.net.client.defaultReadTimeout=120000"
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --version && break || sleep 5; done
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
          mkdir -p ../../../dist-apks
          cp app/build/outputs/apk/release/*.apk ../../../dist-apks/mathnotes-agents.apk

      - name: Upload Agents APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathnotes-agents-apk
          path: dist-apks/mathnotes-agents.apk

  publish-release:
    name: Publish Official Release APKs
    needs: [build-student-apk, build-teacher-apk, build-agents-apk]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download Student APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mathnotes-student-apk
          path: dist-release

      - name: Download Teacher APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mathnotes-teacher-apk
          path: dist-release

      - name: Download Agents APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mathnotes-agents-apk
          path: dist-release

      - name: Check available APKs
        run: ls -la dist-release/ || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Mathnotes Mobile Apps v1.0.0 (Official Release APKs)"
          body: |
            ### Official Mathnotes Android Application Packages (v1.0.0)

            - **Mathnotes Student**: `mathnotes-student.apk`
            - **Mathnotes Teacher Studio**: `mathnotes-teacher.apk`
            - **Mathnotes Command OS (Agents)**: `mathnotes-agents.apk`

            Download directly to your Android device to install and test with Tutor LMS Pro, FluentCRM, VM SEO Brain, and MathNotes AI.
          files: dist-release/*.apk
